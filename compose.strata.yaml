services:
  strata:
    image: ghcr.io/niko1221/strata:0.2.9-rocm-gfx120x
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:?Run make run-strata to detect GPU groups}"
      - "${RENDER_GID:?Run make run-strata to detect GPU groups}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: 2gb
    stop_grace_period: 2m
    ports:
      - ${STRATA_PORT:-8080}:8080
    environment:
      FAMILY: ${STRATA_FAMILY:-qwen}
      MODEL: ${STRATA_MODEL:-IQ2_XS}
      MODEL_PATH: ${STRATA_MODEL_PATH:-/models}
      CONTEXT: ${STRATA_CONTEXT:-32k}
      PARALLEL: ${STRATA_PARALLEL:-1}
      VISION: ${STRATA_VISION:-off}
      TUNE: ${STRATA_TUNE:-skip}
      STRATA_SET: ${STRATA_SET:-}
      # These are launch switches, not advanced engine KEY=VALUE settings.
      MTP: ${STRATA_MTP:-}
      DRAFTING: ${STRATA_DRAFTING:-}
      # Qwen3.6 serve currently also requires batch > 1 for device MTP.
      STRATA_BATCH_MTP: ${STRATA_BATCH_MTP:-}
      PRESET: ${PRESET:-docker}
      API_KEY: ${STRATA_API_KEY}
    volumes:
      - ./data/models:/models:ro
      - ./data/strata:/data
      # Strata 0.2.9 entrypoint plus explicit MTP/DRAFTING env forwarding.
      - ./docker/strata-entrypoint.sh:/opt/strata/entrypoint.sh:ro

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.0
    depends_on:
      strata:
        condition: service_healthy
    ports:
      - ${OPENWEBUI_PORT:-80}:8080
    environment:
      - OPENAI_API_BASE_URL=http://strata:8080/v1
      - OPENAI_API_KEY=${STRATA_API_KEY}
      - ENABLE_OLLAMA_API=False
      - ENABLE_PERSISTENT_CONFIG=False
      - WEBUI_SECRET_KEY=
    volumes:
      - ./data/open-webui:/app/backend/data

networks:
  default:
    ipam:
      config:
        - subnet: ${GGUF_ROCM_SUBNET:-192.168.240.0/24}
